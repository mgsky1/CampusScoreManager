spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smxy_class?useSSL=false&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: your-mysql-password-here

campusscore:
  jwt:
    # 至少 256 位（32 字节）的强随机字符串
    secret: your-strong-random-secret-at-least-32-bytes-here
